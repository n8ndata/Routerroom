<!-- =========================================================
     NO-ZOOM GUARD — ล็อกการขยายซูมทุกรูปแบบ
     (พินช์บนมือถือ / ดับเบิลทัป / Ctrl+ล้อเมาส์ / Ctrl+เคีย์บอร์ด)
     การเลื่อนหน้าและการกดปุ่มยังทำงานได้ตามปกติ
     ========================================================= -->
<script>
(function () {
  'use strict';

  var VIEWPORT = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
  var ZOOM_KEYS = ['+', '=', '-', '_', '0', 'Add', 'Subtract', 'Equal'];
  var lastTouchEnd = 0;

  // iOS Safari: กันการซูมด้วยท่ากระทั่ง (pinch-zoom)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });

  // กันการซูมด้วย Ctrl/⌘ + เลื่อนล้อเมาส์ (เดสก์ท็อป)
  document.addEventListener('wheel', function (e) {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive: false });

  // กันการซูมด้วยคีย์บอร์ด (Ctrl/⌘ + + / - / 0)
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (ZOOM_KEYS.indexOf(e.key) !== -1) e.preventDefault();
  }, { passive: false });

  // กันการซูมด้วยการแตะสองครั้ง (เบราว์เซอร์รุ่นเก่า) — ไม่กระทบการกดปุ่มซ้ำ
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 320) {
      var t = e.changedTouches && e.changedTouches[0];
      var el = t && t.target;
      var interactive = el && el.closest && el.closest('a,button,input,select,textarea,label,[role="button"]');
      if (!interactive) e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  // บังคับระดับการขยาย = 1 เสมอ (กันเบราว์เซอร์ที่พยายามคืนค่าซูมเอง)
  function lockScale() {
    var vp = document.querySelector('meta[name="viewport"]');
    if (!vp) {
      vp = document.createElement('meta');
      vp.setAttribute('name', 'viewport');
      document.head.appendChild(vp);
    }
    if (vp.getAttribute('content') !== VIEWPORT) vp.setAttribute('content', VIEWPORT);
  }
  lockScale();
  window.addEventListener('resize', lockScale);
  window.addEventListener('orientationchange', lockScale);
})();
</script>

<script>
/* =========================================================
   LOGIN PAGE SCRIPT — Firebase Authentication Integration
   ========================================================= */

// ระบบเข้าสู่ระบบแบบบัญชีเดียว: Admin เท่านั้น
async function handleLogin(e) {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const loginBtn = document.getElementById('loginBtn');
  const authError = document.getElementById('authError');
  const originalText = loginBtn.textContent;

  authError.textContent = '';
  authError.classList.remove('visible');
  loginBtn.textContent = 'กำลังตรวจสอบ...';
  loginBtn.disabled = true;

  // อนุญาตเฉพาะชื่อผู้ใช้ Admin และรหัสผ่านที่กำหนดไว้
  if (username !== 'Admin' || password !== 'St1910') {
    authError.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
    authError.classList.add('visible');
    loginBtn.textContent = originalText;
    loginBtn.disabled = false;
    return;
  }

  const adminSession = {
    uid: 'local-admin',
    username: 'Admin',
    email: 'Admin',
    displayName: 'Admin',
    role: 'admin',
    loginAt: new Date().toISOString()
  };

  try {
    localStorage.setItem('router_user_role', JSON.stringify(adminSession));
    await Swal.fire({
      icon: 'success',
      title: 'เข้าสู่ระบบสำเร็จ!',
      text: 'ยินดีต้อนรับผู้ดูแลระบบ (Admin)',
      timer: 1000,
      showConfirmButton: false
    });
    window.location.href = 'index.html';
  } catch (error) {
    console.error('Login failed:', error);
    authError.textContent = 'ไม่สามารถบันทึกสถานะเข้าสู่ระบบได้ กรุณาเปิดใช้งาน Local Storage';
    authError.classList.add('visible');
    loginBtn.textContent = originalText;
    loginBtn.disabled = false;
  }
}

// แปลง Firebase Auth error เป็นข้อความไทย + วิธีแก้
function friendlyAuthError(error) {
  'use strict';
  const code = (error && error.code) || '';
  const host = (location && location.host) || 'โดเมนปัจจุบัน';

  const MESSAGES = {
    // ===== สาเหตุที่พบบ่อยที่สุด "เมื่อขึ้นออนไลน์" =====
    'auth/unauthorized-domain':
      'โดเมน "' + host + '" ยังไม่ได้ลงทะเบียนใน Firebase ' +
      '(วิธีแก้: Firebase Console → Authentication → Settings → Authorized domains → Add domain → ใส่ "' + host + '" → Save)',
    'auth/operation-not-allowed':
      'ยังไม่ได้เปิดใช้งาน Email/Password (วิธีแก้: Firebase Console → Authentication → Sign-in method → Email/Password → Enable)',
    'auth/configuration-not-found':
      'Firebase Authentication ยังไม่ถูกตั้งค่าในโปรเจกต์ (วิธีแก้: เปิดใช้งาน provider อย่างน้อยหนึ่งตัวใน Sign-in method ก่อน)',

    // ===== ข้อมูลล็อกอินไม่ถูกต้อง =====
    'auth/invalid-email': 'รูปแบบอีเมลไม่ถูกต้อง — กรอกอีเมลเต็ม เช่น name@gmail.com',
    'auth/user-not-found': 'ไม่พบบัญชีนี้ในระบบ — ต้องสร้างผู้ใช้ที่ Authentication → Users ก่อน',
    'auth/wrong-password': 'รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง',
    'auth/invalid-credential': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
    'auth/invalid-login-credentials': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
    'auth/user-disabled': 'บัญชีนี้ถูกระงับการใช้งาน',

    // ===== ปัญหาการเชื่อมต่อ =====
    'auth/network-request-failed': 'เชื่อมต่อ Firebase ไม่ได้ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่',
    'auth/too-many-requests': 'พยายามหลายครั้งเกินไป กรุณารอ 1-2 นาทีแล้วลองใหม่',
    'auth/internal-error': 'เกิดข้อผิดพลาดภายในของ Firebase กรุณาลองใหม่ภายหลัง',
    'auth/api-key-not-valid': 'Firebase API Key ไม่ถูกต้องหรือถูกจำกัดโดเมน (ตรวจสอบการตั้งค่า API Key ใน Google Cloud Console)',
    'auth/app-not-authorized': 'โดเมนนี้ไม่ได้รับอนุญาตให้ใช้ API Key นี้ (วิธีแก้: เพิ่มโดเมนใน Authorized domains หรือปรับ API restrictions)'
  };

  if (MESSAGES[code]) return MESSAGES[code] + ' [' + code + ']';

  // Error อื่น ๆ: แสดงข้อความเดิมถ้ามี
  return (error && error.message) || 'เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบข้อมูลให้ถูกต้อง';
}

// ฟังก์ชันสำหรับการล็อกอัพ
function handleLogout() {
  firebase.auth().signOut().then(() => {
    localStorage.removeItem('router_user_role');
    Swal.fire({
      icon: 'success',
      title: 'ออกจากระบบสำเร็จ',
      text: 'คุณได้ออกจากระบบเรียบร้อย',
      timer: 1200,
      showConfirmButton: false
    });
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1200);
  }).catch((error) => {
    console.error('Sign out error:', error);
    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
  });
}

// ฟังก์ชันตรวจสอบสถานะการล็อกอินล่วงหน้า
function checkAuthStatus() {
  const storedUser = localStorage.getItem('router_user_role');
  if (storedUser) {
    const userData = JSON.parse(storedUser);
    // ถ้ามีข้อมูลผู้ใช้แล้ว ให้ไปยังหน้าหลักทันที
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 500);
  }
}

// ตั้งค่า event listeners
document.addEventListener('DOMContentLoaded', function() {
  // ตรวจสอบสถานะก่อนแสดงหน้า
  checkAuthStatus();

  // จัดการการส่งฟอร์มล็อกอิน
  const loginForm = document.getElementById('loginForm');
  if (loginForm) {
    loginForm.addEventListener('submit', handleLogin);
  }

});

// รับการกด Enter ในช่องรหัสผ่านเพื่อส่งฟอร์ม
document.getElementById('password')?.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('loginForm')?.requestSubmit();
  }
});
</script>
